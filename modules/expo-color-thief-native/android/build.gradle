apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.colorthiefnative'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.colorthiefnative"
  defaultConfig {
    minSdkVersion 24
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "0.1.0"
  }
  compileSdkVersion safeExtGet("compileSdkVersion", 34)
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  // Sem dependências externas: MMCQ, OKLab e swatches são implementação
  // própria em Kotlin puro (ver ColorMath.kt / MMCQ.kt / SwatchExtractor.kt),
  // o que evita puxar o androidx.palette inteiro só por causa dos swatches.
}
